[package]
name = "corky-social"
version = "0.29.0"
edition = "2024"
description = "Corky social publishing commands"
license = "Apache-2.0"
repository = "https://github.com/btakita/corky"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
corky-core = { version = "0.29.0", path = "../corky-core" }
form_urlencoded = "1"
mime_guess = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "2", features = ["json"] }

[lints.rust]
warnings = "deny"
