[package]
name = "corky-transcribe"
version = "0.29.0"
edition = "2024"
description = "Corky audio transcription and diarization"
license = "Apache-2.0"
repository = "https://github.com/btakita/corky"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
corky-core = { version = "0.29.0", path = "../corky-core" }
hound = { version = "3.5", optional = true }
ort = { version = "=2.0.0-rc.10", optional = true, features = ["ndarray"] }
pyannote-rs = { version = "0.3", optional = true }
rubato = { version = "0.16", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", optional = true, features = ["mp3", "isomp4", "aac", "alac", "pcm", "wav", "flac", "ogg", "vorbis"] }
ureq = { version = "2", features = ["json"] }
whisper-rs = { version = "0.16", optional = true }

[features]
default = []
transcribe = ["whisper-rs", "symphonia", "rubato", "hound"]
transcribe-cuda = ["transcribe", "whisper-rs/cuda"]
transcribe-metal = ["transcribe", "whisper-rs/metal"]
diarize = ["transcribe", "pyannote-rs", "ort"]

[lints.rust]
warnings = "deny"
