[package]
name = "corky-core"
version = "0.29.0"
edition = "2024"
description = "Shared Corky configuration, storage, auth, and filesystem foundations"
license = "Apache-2.0"
repository = "https://github.com/btakita/corky"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
form_urlencoded = "1"
libc = "0.2"
once_cell = "1"
open = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "2", features = ["json"] }

[lints.rust]
warnings = "deny"
