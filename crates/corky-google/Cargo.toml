[package]
name = "corky-google"
version = "0.28.2"
edition = "2024"
description = "Corky Google Workspace, Calendar, Search Console, and Tasks commands"
license = "Apache-2.0"
repository = "https://github.com/btakita/corky"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
corky-core = { version = "0.28.2", path = "../corky-core" }
form_urlencoded = "1"
jsonwebtoken = "9"
mime_guess = "2"
open = "5"
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
mockito = "1"

[lints.rust]
warnings = "deny"
