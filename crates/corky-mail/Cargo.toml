[package]
name = "corky-mail"
version = "0.29.0"
edition = "2024"
description = "Corky mail sync, drafts, contacts, filters, mailboxes, and search"
license = "Apache-2.0"
repository = "https://github.com/btakita/corky"

[dependencies]
agent-kit = "0.4"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
corky-core = { version = "0.29.0", path = "../corky-core" }
corky-google = { version = "0.29.0", path = "../corky-google" }
corky-social = { version = "0.29.0", path = "../corky-social" }
filetime = "0.2.27"
form_urlencoded = "1"
glob = "0.3"
htmd = "0.5"
imap = "2"
instruction-files = "0.2.2"
lettre = "0.11"
libc = "0.2"
mailparse = "0.15"
mime_guess = "2"
native-tls = "0.2"
once_cell = "1"
open = "5"
pulldown-cmark = "0.12"
quick-xml = { version = "0.39.2", features = ["serialize"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "2", features = ["json"] }
zip = "2"

[features]
vendored-openssl = ["native-tls/vendored"]

[lints.rust]
warnings = "deny"
