[package]
name = "corky"
version = "0.29.0"
edition = "2024"
description = "Sync email threads from IMAP to Markdown, draft replies, manage collaborators"
license = "Apache-2.0"
repository = "https://github.com/btakita/corky"
readme = "README.md"

[workspace]
members = [
    ".",
    "crates/corky-core",
    "crates/corky-google",
    "crates/corky-mail",
    "crates/corky-social",
    "crates/corky-transcribe",
]
resolver = "3"

[[bin]]
name = "corky"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
anyhow = "1"
thiserror = "2"
imap = "2"
native-tls = "0.2"
mailparse = "0.15"
lettre = "0.11"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
regex = "1"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
glob = "0.3"
libc = "0.2"
openssl = { version = "0.10", features = ["vendored"], optional = true }
tempfile = "3"
zip = "2"
filetime = "0.2.27"
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
open = "5"
serde_yaml = "0.9"
mime_guess = "2"
agent-kit = "0.4"
instruction-files = "0.2.2"
quick-xml = { version = "0.39.2", features = ["serialize"] }
pulldown-cmark = "0.12"
base64 = "0.22"
form_urlencoded = "1"
htmd = "0.5"
jsonwebtoken = "9"
corky-core = { version = "0.29.0", path = "crates/corky-core" }
corky-google = { version = "0.29.0", path = "crates/corky-google" }
corky-mail = { version = "0.29.0", path = "crates/corky-mail" }
corky-social = { version = "0.29.0", path = "crates/corky-social" }
corky-transcribe = { version = "0.29.0", path = "crates/corky-transcribe", default-features = false, optional = true }

[features]
default = ["transcribe", "diarize"]
vendored-openssl = ["openssl", "native-tls/vendored", "corky-mail/vendored-openssl"]
transcribe = ["dep:corky-transcribe", "corky-transcribe/transcribe"]
transcribe-cuda = ["transcribe", "corky-transcribe/transcribe-cuda"]
transcribe-metal = ["transcribe", "corky-transcribe/transcribe-metal"]
diarize = ["transcribe", "corky-transcribe/diarize"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
pretty_assertions = "1"
mockito = "1"

[lints.rust]
warnings = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
